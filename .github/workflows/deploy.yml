name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies (if present)
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found — skipping install"
          fi

      # 4. Build site or copy static files
      - name: Build site
        run: |
          rm -rf dist
          mkdir dist

          if [ -f package.json ]; then
            npm run build
          else
            find . -maxdepth 1 \
              ! -name "dist" \
              ! -name ".git" \
              ! -name ".github" \
              ! -name "." \
              -exec cp -R {} dist/ \;
          fi

          # Disable Jekyll
          touch dist/.nojekyll

          echo "Build output:"
          ls -al dist

      # 5. Upload Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4